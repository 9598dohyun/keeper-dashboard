name: Refresh Dashboard Metrics

# 2026-08-26: 자동 스케줄 중단. 결제 데이터를 엑셀로 받아 수동 반영하는 방식으로 전환했다.
# 되살리려면 아래 schedule 블록의 주석을 해제한다.
on:
  # schedule:
  #   - cron: '20 14 * * *'   # KST 23:20 (매일)
  workflow_dispatch: # 수동 실행

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Fetch Airtable data
        run: npx tsx scripts/fetch-airtable.ts
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      - name: Compute metrics & push to KV
        run: npx tsx scripts/compute-and-push.ts
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      # 전환율 진단(metrics3) — 같은 수집분으로 계산, 그날 날짜로 스냅샷 저장
      - name: Compute diagnosis & push to KV
        run: npx tsx scripts/compute-diagnosis.ts
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          TZ: Asia/Seoul
