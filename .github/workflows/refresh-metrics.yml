name: Refresh Dashboard Metrics

on:
  schedule:
    # 하루 1회, 마감 후 수집 → 그날 날짜로 스냅샷 저장
    # KST 23:20 = UTC 14:20
    # 23:59로 두면 Actions 스케줄 지연(수십 분)에 자정을 넘겨 날짜가 밀리고
    # "오늘 응대" 0건인 빈 스냅샷이 저장된다. 여유를 두고 23:20에 실행한다.
    # (지연으로 자정을 넘겨도 compute 쪽 targetDateKST가 전날로 보정)
    - cron: '20 14 * * *'   # KST 23:20 (매일)
  workflow_dispatch: # 수동 실행

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Fetch Airtable data
        run: npx tsx scripts/fetch-airtable.ts
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      - name: Compute metrics & push to KV
        run: npx tsx scripts/compute-and-push.ts
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      # 전환율 진단(metrics3) — 같은 수집분으로 계산, 그날 날짜로 스냅샷 저장
      - name: Compute diagnosis & push to KV
        run: npx tsx scripts/compute-diagnosis.ts
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          TZ: Asia/Seoul
