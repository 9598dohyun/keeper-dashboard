name: Refresh Dashboard Metrics

on:
  schedule:
    # 하루 1회, 마감 직전 수집 → 그날 날짜로 스냅샷 저장
    # KST 23:59 = UTC 14:59
    - cron: '59 14 * * *'   # KST 23:59 (매일)
  workflow_dispatch: # 수동 실행

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Fetch Airtable data
        run: npx tsx scripts/fetch-airtable.ts
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      - name: Compute metrics & push to KV
        run: npx tsx scripts/compute-and-push.ts
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
