name: Refresh Dashboard Metrics

on:
  schedule:
    # 12시간 단위 업데이트 (UTC 기준)
    # KST 07:59 = UTC 22:59, KST 19:59 = UTC 10:59
    - cron: '59 22 * * *'   # KST 07:59 (매일)
    - cron: '59 10 * * *'   # KST 19:59 (매일)
  workflow_dispatch: # 수동 실행

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Fetch Airtable data
        run: npx tsx scripts/fetch-airtable.ts
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      - name: Compute metrics & push to KV
        run: npx tsx scripts/compute-and-push.ts
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
